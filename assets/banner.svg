<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Darshak Alapati, Data Scientist and AI Product Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1d33"/>
      <stop offset="1" stop-color="#132a44"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7dd3fc" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5b14c"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="16" fill="url(#dots)"/>

  <!-- rising trend line on the right -->
  <path d="M640 250 L720 232 L790 240 L860 200 L930 212 L1000 160 L1070 172 L1140 112 L1210 84 L1250 70 L1250 300 L640 300 Z" fill="url(#area)"/>
  <path d="M640 250 L720 232 L790 240 L860 200 L930 212 L1000 160 L1070 172 L1140 112 L1210 84 L1250 70" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#0b1220" stroke-width="2.5">
    <circle cx="860" cy="200" r="5" stroke="#2dd4bf"/>
    <circle cx="1000" cy="160" r="5" stroke="#5fd0c0"/>
    <circle cx="1140" cy="112" r="5" stroke="#b9c48a"/>
    <circle cx="1250" cy="70" r="6" stroke="#f5b14c"/>
  </g>
  <!-- faint bars -->
  <g fill="#7dd3fc" fill-opacity="0.07">
    <rect x="700" y="196" width="22" height="104" rx="3"/>
    <rect x="770" y="214" width="22" height="86" rx="3"/>
    <rect x="840" y="168" width="22" height="132" rx="3"/>
    <rect x="910" y="182" width="22" height="118" rx="3"/>
    <rect x="980" y="130" width="22" height="170" rx="3"/>
    <rect x="1050" y="140" width="22" height="160" rx="3"/>
    <rect x="1120" y="90" width="22" height="210" rx="3"/>
    <rect x="1190" y="64" width="22" height="236" rx="3"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="104" fill="#2dd4bf" font-size="18" font-weight="600" letter-spacing="3">DATA · ANALYTICS · AI</text>
    <text x="64" y="162" fill="#f1f5f9" font-size="56" font-weight="700">Darshak Alapati</text>
    <text x="64" y="206" fill="#cbd5e1" font-size="26" font-weight="400">Data Scientist &amp; AI Product Engineer</text>
    <text x="64" y="250" fill="#94a3b8" font-size="18">Ex-Accenture  ·  M.S. Data Science  ·  Wichita, KS</text>
  </g>
</svg>
